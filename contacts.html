<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacts - SalesTrack</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar border-bottom px-4">
    <span class="navbar-brand fw-bold">SalesTrack</span>
    <div class="d-flex align-items-center gap-3">
      <a href="dashboard.html" class="navlink">Dashboard</a>
      <a href="pipeline.html" class="navlink">Pipeline</a>
      <a href="contacts.html" class="navlink-active">Contacts</a>
      <a href="scorecards.html" class="navlink">Scorecards</a>
      <a href="reports.html" class="navlink">Reports</a>
      <button id="logoutBtn" class="btn btn-outline-danger btn-sm">Log out</button>
    </div>
  </nav>

  <div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1 class="h3">Contacts</h1>
      <button class="btn btn-accent" data-bs-toggle="modal" data-bs-target="#addContactModal">Add contact</button>
    </div>

    <div class="table-responsive">
      <table class="table table-dark table-hover">
        <thead>
          <tr><th>Name</th><th>Phone</th><th>Email</th><th>Company</th></tr>
        </thead>
        <tbody id="contactsTableBody"></tbody>
      </table>
    </div>
  </div>

  <!-- Add Contact Modal -->
  <div class="modal fade" id="addContactModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content modal-content-dark">
        <div class="modal-header">
          <h5 class="modal-title">Add contact</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <form id="addContactForm">
          <div class="modal-body">
            <input type="text" class="form-control mb-2" id="cName" placeholder="Full name" required>
            <input type="text" class="form-control mb-2" id="cPhone" placeholder="Phone">
            <input type="email" class="form-control mb-2" id="cEmail" placeholder="Email">
            <input type="text" class="form-control mb-2" id="cCompany" placeholder="Company">
          </div>
          <div class="modal-footer">
            <button type="submit" class="btn btn-accent">Save</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/contacts.js"></script>
</body>
</html>
