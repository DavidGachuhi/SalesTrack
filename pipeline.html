<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pipeline - SalesTrack</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar border-bottom px-4">
    <span class="navbar-brand fw-bold">SalesTrack</span>
    <div class="d-flex align-items-center gap-3">
      <a href="dashboard.html" class="navlink">Dashboard</a>
      <a href="pipeline.html" class="navlink-active">Pipeline</a>
      <a href="contacts.html" class="navlink">Contacts</a>
      <a href="scorecards.html" class="navlink">Scorecards</a>
      <a href="reports.html" class="navlink">Reports</a>
      <button id="logoutBtn" class="btn btn-outline-danger btn-sm">Log out</button>
    </div>
  </nav>

  <div class="container-fluid mt-4 px-4 d-flex justify-content-between align-items-center mb-3">
  <h1 class="h3 mb-4">Lead Pipeline</h1>
  <button class="btn btn-accent" data-bs-toggle="modal" data-bs-target="#addLeadModal">Add lead</button>
  </div>


    <div class="d-flex gap-3" style="overflow-x:auto;">
      <div class="kanban-column" data-stage="New Lead">
        <h6 class="kanban-header">New Lead</h6>
        <div class="kanban-cards" id="col-New Lead"></div>
      </div>
      <div class="kanban-column" data-stage="Contacted">
        <h6 class="kanban-header">Contacted</h6>
        <div class="kanban-cards" id="col-Contacted"></div>
      </div>
      <div class="kanban-column" data-stage="Qualified">
        <h6 class="kanban-header">Qualified</h6>
        <div class="kanban-cards" id="col-Qualified"></div>
      </div>
      <div class="kanban-column" data-stage="Proposal Sent">
        <h6 class="kanban-header">Proposal Sent</h6>
        <div class="kanban-cards" id="col-Proposal Sent"></div>
      </div>
      <div class="kanban-column" data-stage="Negotiation">
        <h6 class="kanban-header">Negotiation</h6>
        <div class="kanban-cards" id="col-Negotiation"></div>
      </div>
      <div class="kanban-column" data-stage="Closed Won">
        <h6 class="kanban-header">Closed Won</h6>
        <div class="kanban-cards" id="col-Closed Won"></div>
      </div>
      <div class="kanban-column" data-stage="Closed Lost">
        <h6 class="kanban-header">Closed Lost</h6>
        <div class="kanban-cards" id="col-Closed Lost"></div>
      </div>
    </div>
  

  <div class="modal fade" id="addLeadModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content modal-content-dark">
      <div class="modal-header">
        <h5 class="modal-title">Add lead</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <form id="addLeadForm">
        <div class="modal-body">
          <input type="text" class="form-control mb-2" id="leadTitle" placeholder="Lead title (e.g. Jane Doe - Life Insurance)" required>
          <select class="form-select mb-2" id="leadContact">
            <option value="">Link to contact (optional)...</option>
          </select>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-accent">Create lead</button>
        </div>
      </form>
    </div>
  </div>
</div>

  <div class="modal fade" id="logActivityModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content modal-content-dark">
      <div class="modal-header">
        <h5 class="modal-title" id="activityModalLeadTitle">Log activity</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <form id="logActivityForm">
        <div class="modal-body">
          <input type="hidden" id="activityLeadId">
          <select class="form-select mb-2" id="activityType" required>
            <option value="">Select type...</option>
            <option value="Call">Call</option>
            <option value="Email">Email</option>
            <option value="Meeting">Meeting</option>
            <option value="Note">Note</option>
          </select>
          <textarea class="form-control" id="activityNotes" placeholder="Notes" rows="3"></textarea>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-accent">Save</button>
        </div>
      </form>
    </div>
  </div>
</div>

  <div class="modal fade" id="leadDetailModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content modal-content-dark">
        <div class="modal-header">
          <h5 class="modal-title" id="leadDetailTitle">Lead detail</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <span class="badge badge-accent" id="leadDetailStageBadge"></span>
            <span class="badge bg-danger d-none" id="leadDetailOverdueBadge">Overdue</span>
          </div>
          <div class="row mb-3">
            <div class="col-sm-6">
              <div class="text-muted small">Score</div>
              <div id="leadDetailScore" class="fw-bold"></div>
            </div>
            <div class="col-sm-6">
              <div class="text-muted small">Contact</div>
              <div id="leadDetailContact"></div>
            </div>
          </div>
          <div class="mb-3 d-none" id="leadDetailReasonWrap">
            <div class="text-muted small">Closed reason</div>
            <div id="leadDetailReason"></div>
          </div>
          <hr>
          <h6>Activity history</h6>
          <div id="leadDetailActivities" class="d-flex flex-column gap-2"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-light log-activity-btn" id="leadDetailLogActivityBtn" data-bs-dismiss="modal">Log activity</button>
        </div>
      </div>
    </div>
  </div>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/pipeline.js"></script>
</body>
</html>
