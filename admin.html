<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin - SalesTrack</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar border-bottom px-4">
    <span class="navbar-brand fw-bold">SalesTrack</span>
    <div class="d-flex gap-3">
      <a href="dashboard.html" class="text-decoration-none" style="color:var(--text)">Dashboard</a>
      <a href="pipeline.html" class="text-decoration-none" style="color:var(--text)">Pipeline</a>
      <a href="contacts.html" class="text-decoration-none" style="color:var(--text)">Contacts</a>
      <a href="scorecards.html" class="text-decoration-none" style="color:var(--text)">Scorecards</a>
      <a href="reports.html" class="text-decoration-none" style="color:var(--text)">Reports</a>
      <a href="admin.html" class="text-decoration-none fw-bold" style="color:var(--accent)">Admin</a>
      <button id="logoutBtn" class="btn btn-outline-danger btn-sm">Log out</button>
    </div>
  </nav>

  <div class="container mt-4">
    <h1 class="h3 mb-4">Administration</h1>

    <div class="row g-4">
      <div class="col-md-7">
        <h5>User accounts</h5>
        <table class="table table-dark table-hover">
          <thead><tr><th>Name</th><th>Role</th><th>Status</th><th></th></tr></thead>
          <tbody id="usersTableBody"></tbody>
        </table>
      </div>

      <div class="col-md-5">
        <h5>Recent activity (audit log)</h5>
        <div id="auditLogList" class="d-flex flex-column gap-2"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
