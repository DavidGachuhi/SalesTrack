<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SalesTrack</title>
      <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabaseClient.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
  
<body class="d-flex align-items-center justify-content-center vh-100">
  <div class="text-center mb-4 position-absolute top-0 mt-5">
    <h2 class="fw-bold" style="color:var(--text)">SalesTrack</h2>
    <p class="text-muted small">Sales team management for service-based SMEs</p>
  </div>

  <div class="card p-4 shadow-sm" style="width: 360px; border-radius: 8px;">
    <h1 class="h4 mb-3">Sign in</h1>
    <form id="loginForm">
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" required>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password" required>
      </div>
      <div id="errorMsg" class="text-danger small mb-2"></div>
      <button type="submit" class="btn w-100" style="background-color:var(--accent); color:white;">Sign in</button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
