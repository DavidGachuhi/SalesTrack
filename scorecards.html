<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scorecards - SalesTrack</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar border-bottom px-4">
    <span class="navbar-brand fw-bold">SalesTrack</span>
    <div class="d-flex align-items-center gap-3">
      <a href="dashboard.html" class="navlink">Dashboard</a>
      <a href="pipeline.html" class="navlink">Pipeline</a>
      <a href="contacts.html" class="navlink">Contacts</a>
      <a href="scorecards.html" class="navlink-active">Scorecards</a>
      <a href="reports.html" class="navlink">Reports</a>
      <button id="logoutBtn" class="btn btn-outline-danger btn-sm">Log out</button>
    </div>
  </nav>

  <div class="container mt-4">
    <h1 class="h3 mb-4">Performance Scorecards</h1>

    <!-- Agent: submit self-assessment -->
    <div id="agentSection" class="d-none">
      <div class="card p-3 mb-4" style="max-width:500px;">
        <h5>Submit self-assessment</h5>
        <form id="selfAssessForm">
          <input type="text" class="form-control mb-2" id="period" placeholder="Period (e.g. July 2026)" required>
          <label class="form-label">Self score (1-10)</label>
          <input type="number" min="1" max="10" class="form-control mb-2" id="agentScore" required>
          <textarea class="form-control mb-2" id="agentComments" placeholder="Comments" rows="3"></textarea>
          <button type="submit" class="btn btn-accent">Submit</button>
        </form>
      </div>
    </div>

    <h5>My scorecards</h5>
    <div class="table-responsive">
      <table class="table table-dark table-hover">
        <thead>
          <tr><th>Period</th><th>Agent</th><th>Self score</th><th>Manager score</th><th>Manager comments</th><th></th></tr>
        </thead>
        <tbody id="scorecardsTableBody"></tbody>
      </table>
    </div>
  </div>

  <!-- Manager scoring modal -->
  <div class="modal fade" id="managerScoreModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content modal-content-dark">
        <div class="modal-header">
          <h5 class="modal-title">Manager scoring</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <form id="managerScoreForm">
          <div class="modal-body">
            <input type="hidden" id="scorecardId">
            <label class="form-label">Manager score (1-10)</label>
            <input type="number" min="1" max="10" class="form-control mb-2" id="managerScore" required>
            <textarea class="form-control mb-2" id="managerComments" placeholder="Coaching notes" rows="3"></textarea>
          </div>
          <div class="modal-footer">
            <button type="submit" class="btn btn-accent">Save</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/scorecards.js"></script>
</body>
</html>
