<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reports - SalesTrack</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar border-bottom px-4">
    <span class="navbar-brand fw-bold">SalesTrack</span>
    <div class="d-flex align-items-center gap-3">
      <a href="dashboard.html" class="navlink">Dashboard</a>
      <a href="pipeline.html" class="navlink">Pipeline</a>
      <a href="contacts.html" class="navlink">Contacts</a>
      <a href="scorecards.html" class="navlink">Scorecards</a>
      <a href="reports.html" class="navlink-active">Reports</a>
      <button id="logoutBtn" class="btn btn-outline-danger btn-sm">Log out</button>
    </div>
  </nav>

  <div class="container mt-4">
    <h1 class="h3 mb-4">Reporting Dashboard</h1>

    <div class="row g-4">
      <div class="col-md-6">
        <div class="card p-3">
          <h6 class="text-muted mb-3">Leads by stage</h6>
          <canvas id="stageChart"></canvas>
        </div>
      </div>
      <div class="col-md-6">
        <div class="card p-3">
          <h6 class="text-muted mb-3">Won vs Lost</h6>
          <canvas id="winLossChart"></canvas>
        </div>
      </div>
      <div class="col-md-6">
        <div class="card p-3">
          <h6 class="text-muted mb-3">Activity volume by agent</h6>
          <canvas id="activityChart"></canvas>
        </div>
      </div>
      <div class="col-md-6">
        <div class="card p-3">
          <h6 class="text-muted mb-3">Self vs Manager scores</h6>
          <canvas id="scoreChart"></canvas>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/reports.js"></script>
</body>
</html>
